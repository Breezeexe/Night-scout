[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "night-scout"
version = "0.1.0"
description = "Recursive, scope-aware attack-surface intelligence for authorized bug-bounty reconnaissance."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Night Scout Contributors" }
]
keywords = [
    "recon",
    "bug-bounty",
    "attack-surface",
    "security",
    "osint",
    "asset-discovery",
]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "structlog>=24.1",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "coverage[toml]>=7.5",
    "ruff>=0.6",
    "mypy>=1.11",
]
release = [
    "pyinstaller>=6.0",
]

[project.scripts]
nightscout = "recon.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["recon*", "migrations*", "scripts*"]

[tool.setuptools.package-data]
migrations = ["script.py.mako", "versions/*.py"]
scripts = ["tools_manifest.yaml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
branch = true
source = ["recon"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ASYNC",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "yaml.*",
]
ignore_missing_imports = true
