schema_version: 1
supported_os_ids:
  - debian
  - kali
supported_arches:
  - x86_64
  - aarch64
managed_root: ~/.local/share/nightscout/tools

tools:
  - tool_id: pdtm
    binary: pdtm
    requirement: optional
    description: ProjectDiscovery Tool Manager used to install official PD release binaries
    strategy: github_binary
    repository: projectdiscovery/pdtm
    asset_regex: '^pdtm_.*_linux_{goarch}\.zip$'
    checksum_asset_regex: '(?i)checksums.*\.txt$'
    version_args: [-version]
    identity_regex: 'pdtm|projectdiscovery'

  - tool_id: subfinder
    binary: subfinder
    requirement: required
    workers: [passive_domains]
    description: Passive subdomain enumeration
    strategy: github_binary
    repository: projectdiscovery/subfinder
    asset_regex: '^subfinder_.*_linux_{goarch}\.zip$'
    checksum_asset_regex: '(?i)checksums.*\.txt$'
    version_args: [-version]
    identity_regex: 'subfinder|projectdiscovery'
    apt:
      kali: {package: subfinder, binary: subfinder}

  - tool_id: dnsx
    binary: dnsx
    requirement: required
    workers: [dns]
    description: DNS resolution and negative knowledge
    strategy: github_binary
    repository: projectdiscovery/dnsx
    asset_regex: '^dnsx_.*_linux_{goarch}\.zip$'
    checksum_asset_regex: '(?i)checksums.*\.txt$'
    version_args: [-version]
    identity_regex: 'dnsx|projectdiscovery'
    apt:
      kali: {package: dnsx, binary: dnsx}

  - tool_id: httpx
    binary: httpx
    requirement: required
    workers: [http, content, vhost]
    description: ProjectDiscovery HTTP probing CLI (not the Python httpx CLI)
    strategy: github_binary
    repository: projectdiscovery/httpx
    asset_regex: '^httpx_.*_linux_{goarch}\.zip$'
    checksum_asset_regex: '(?i)checksums.*\.txt$'
    version_args: [-version]
    identity_regex: 'httpx|projectdiscovery'
    apt:
      # Kali renames ProjectDiscovery httpx to avoid collision with Python httpx.
      kali: {package: httpx-toolkit, binary: httpx-toolkit}

  - tool_id: tlsx
    binary: tlsx
    requirement: required
    workers: [tls]
    description: TLS certificate inspection
    strategy: github_binary
    repository: projectdiscovery/tlsx
    asset_regex: '^tlsx_.*_linux_{goarch}\.zip$'
    checksum_asset_regex: '(?i)checksums.*\.txt$'
    version_args: [-version]
    identity_regex: 'tlsx|projectdiscovery'

  - tool_id: asnmap
    binary: asnmap
    requirement: required
    workers: [asn]
    description: Passive ASN/CIDR enrichment
    strategy: github_binary
    repository: projectdiscovery/asnmap
    asset_regex: '^asnmap_.*_linux_{goarch}\.zip$'
    checksum_asset_regex: '(?i)checksums.*\.txt$'
    version_args: [-version]
    identity_regex: 'asnmap|projectdiscovery'

  - tool_id: katana
    binary: katana
    requirement: required
    workers: [crawler]
    description: Bounded web crawler
    strategy: github_binary
    repository: projectdiscovery/katana
    asset_regex: '^katana_.*_linux_{goarch}\.zip$'
    checksum_asset_regex: '(?i)checksums.*\.txt$'
    version_args: [-version]
    identity_regex: 'katana|projectdiscovery'

  - tool_id: urlfinder
    binary: urlfinder
    requirement: required
    workers: [archives]
    description: Passive historical URL collection
    strategy: github_binary
    repository: projectdiscovery/urlfinder
    asset_regex: '^urlfinder_.*_linux_{goarch}\.zip$'
    checksum_asset_regex: '(?i)checksums.*\.txt$'
    version_args: [-version]
    identity_regex: 'urlfinder|projectdiscovery'

  - tool_id: nuclei
    binary: nuclei
    requirement: required
    workers: [nuclei]
    description: Audited read-only CVE validation templates
    strategy: github_binary
    repository: projectdiscovery/nuclei
    asset_regex: '^nuclei_.*_linux_{goarch}\.zip$'
    checksum_asset_regex: '(?i)checksums.*\.txt$'
    version_args: [-version]
    identity_regex: 'nuclei|projectdiscovery'
    apt:
      kali: {package: nuclei, binary: nuclei}

  - tool_id: arjun
    binary: arjun
    requirement: required
    workers: [parameters]
    description: GET query parameter discovery
    strategy: pipx
    package: arjun
    version_args: [-h]
    identity_regex: 'arjun|parameter'
    prerequisite_commands: [pipx]
    prerequisite_apt_packages: [pipx]
    apt:
      kali: {package: arjun, binary: arjun}
      debian: {package: arjun, binary: arjun}

  - tool_id: jadx
    binary: jadx
    requirement: optional
    workers: [mobile]
    description: Android APK decompiler
    strategy: github_archive_app
    repository: skylot/jadx
    asset_regex: '^jadx-[0-9].*\.zip$'
    entrypoint: bin/jadx
    version_args: [--version]
    identity_regex: 'jadx|^[0-9]+\.'
    prerequisite_commands: [java]
    prerequisite_apt_packages: [default-jre-headless]
    apt:
      kali: {package: jadx, binary: jadx}

  - tool_id: apktool
    binary: apktool
    requirement: optional
    workers: [mobile]
    description: Android resources/smali decoder fallback
    strategy: github_jar
    repository: iBotPeaches/Apktool
    asset_regex: '^apktool_[0-9].*\.jar$'
    checksum_asset_regex: '(?i)(sha256|checksums)'
    version_args: [--version]
    identity_regex: '^[0-9]+\.'
    prerequisite_commands: [java]
    prerequisite_apt_packages: [default-jre-headless]
    apt:
      kali: {package: apktool, binary: apktool}
      debian: {package: apktool, binary: apktool}

  - tool_id: gitleaks
    binary: gitleaks
    requirement: optional
    workers: [mobile]
    description: Offline secret candidate detection
    strategy: github_binary
    repository: gitleaks/gitleaks
    asset_regex: '^gitleaks_.*_linux_{asset_arch}\.tar\.gz$'
    checksum_asset_regex: '(?i)checksums.*\.txt$'
    version_args: [version]
    identity_regex: 'gitleaks|^[0-9]+\.'
    apt:
      kali: {package: gitleaks, binary: gitleaks}
      debian: {package: gitleaks, binary: gitleaks}

  - tool_id: trufflehog
    binary: trufflehog
    requirement: optional
    workers: [mobile]
    description: Offline secret candidate detection with verification disabled by worker policy
    strategy: github_binary
    repository: trufflesecurity/trufflehog
    asset_regex: '^trufflehog_.*_linux_{goarch}\.tar\.gz$'
    checksum_asset_regex: '(?i)checksums.*\.txt$'
    version_args: [--version]
    identity_regex: 'trufflehog|^[0-9]+\.'
                                             
