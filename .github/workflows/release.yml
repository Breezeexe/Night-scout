name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  debian-amd64:
    runs-on: ubuntu-latest
    container:
      image: debian:13-slim

    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git gh python3 python3-venv python3-pip libpython3.13 \
            build-essential dpkg-dev

      - name: Checkout
        uses: actions/checkout@v7

      - name: Create isolated build environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev,release]'

      - name: Verify release tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(.venv/bin/python -c 'from recon import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "tag $GITHUB_REF_NAME does not match project version $expected" >&2
            exit 1
          }

      - name: Regression tests
        run: .venv/bin/python -m pytest -q

      - name: Alembic schema check
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import tempfile
          from alembic import command
          from recon.storage.schema import alembic_config

          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / "nightscout.sqlite3"
              cfg = alembic_config(path)
              command.upgrade(cfg, "head")
              command.check(cfg)
          PY

      - name: Build standalone Debian/Kali bundle
        run: .venv/bin/python scripts/build_binary.py --keep-build

      - name: Verify standalone bundle
        run: .venv/bin/python scripts/verify_release.py release/dist/nightscout

      - name: Build Debian package
        run: |
          .venv/bin/python scripts/build_deb.py \
            --bundle release/dist/nightscout \
            --output release
          dpkg-deb --info release/nightscout_*.deb
          dpkg-deb --contents release/nightscout_*.deb | grep '/usr/bin/nightscout'
          dpkg-deb --contents release/nightscout_*.deb | grep '/usr/lib/nightscout/nightscout'

      - name: Install Debian package smoke test
        run: |
          apt-get install -y ./release/nightscout_*.deb
          nightscout --version
          nightscout tools list --json >/tmp/nightscout-tools.json
          grep '"subfinder"' /tmp/nightscout-tools.json

          export XDG_CONFIG_HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$(mktemp -d)"
          export XDG_CACHE_HOME="$(mktemp -d)"
          nightscout setup --skip-tools --skip-wordlists
          test -f "$XDG_CONFIG_HOME/nightscout/pipeline.yaml"
          test -f "$XDG_CONFIG_HOME/nightscout/scope.yaml"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nightscout-debian-kali-amd64
          path: |
            release/nightscout-*.tar.gz
            release/nightscout-*.tar.gz.sha256
            release/nightscout_*.deb
            release/nightscout_*.deb.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; refusing to replace published assets" >&2
            exit 1
          fi

          gh release create "$tag" \
            release/nightscout_*.deb \
            release/nightscout_*.deb.sha256 \
            release/nightscout-*.tar.gz \
            release/nightscout-*.tar.gz.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Night Scout $tag"
