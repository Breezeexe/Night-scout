    weight: 1.10
    max_bytes: 268435456
    max_entries: 250000
    default: false
    license: upstream-defined
    upstream: https://wordlists.assetnote.io/

  - id: commonspeak2.subdomains
    url: https://raw.githubusercontent.com/assetnote/commonspeak2-wordlists/master/subdomains/subdomains.txt
    local_path: cache/assetnote/commonspeak2-subdomains.txt
