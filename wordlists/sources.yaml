version: 1
sources:
  - id: seclists.dns.top5000
    url: https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/subdomains-top1million-5000.txt
    local_path: cache/seclists/subdomains-top1million-5000.txt
    categories: [dns, vhost, general]
    transform: dns_labels
    weight: 1.00
    max_bytes: 2097152
    max_entries: 5000
    default: true
    license: MIT
    upstream: https://github.com/danielmiessler/SecLists

  - id: seclists.web.raft-small-words
    url: https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/raft-small-words.txt
    local_path: cache/seclists/raft-small-words.txt
    categories: [path, api]
    transform: words
    weight: 0.90
    max_bytes: 8388608
    max_entries: 50000
    default: true
    license: MIT
    upstream: https://github.com/danielmiessler/SecLists

  - id: seclists.parameters.burp
    url: https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/burp-parameter-names.txt
    local_path: cache/seclists/burp-parameter-names.txt
    categories: [parameter]
    transform: parameter_names
    weight: 1.00
    max_bytes: 2097152
    max_entries: 20000
    default: true
    license: MIT
    upstream: https://github.com/danielmiessler/SecLists

  - id: seclists.api.endpoints
    url: https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/api/api-endpoints.txt
