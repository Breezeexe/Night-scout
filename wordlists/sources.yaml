    categories: [api, path]
    transform: path_tokens
    weight: 0.90
    max_bytes: 2097152
    max_entries: 20000
    default: true
    license: MIT
    upstream: https://github.com/danielmiessler/SecLists

  - id: assetnote.manual.2m-subdomains
